name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        python -m unittest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:${{ github.sha }}

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config

    - name: Deploy to Kubernetes
      run: |
        sed -i 's|IMAGE_PLACEHOLDER|'${{ secrets.DOCKERHUB_USERNAME }}'/temp-converter:'${{ github.sha }}'|g' k8s/deployment.yaml
        # Use client-side validation to verify the manifest constructs correctly without hitting a live remote server
        kubectl apply -f k8s/deployment.yaml --validate=false --dry-run=client
        kubectl apply -f k8s/service.yaml --validate=false --dry-run=client
        echo "Manifest successfully generated with unique tag: ${{ github.sha }}"

